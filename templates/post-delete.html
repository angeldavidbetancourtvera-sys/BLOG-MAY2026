{% extends '_base.html' %}

{% block content %}
   <h2>¿Estas seguro de eliminar esta publicacion?</h2>
    <p><strong>author:</strong> {{ blog.author.username }}</p>
    <p><strong>created at:</strong> {{ blog.created_at }}</p>
    <p><strong>updated at:</strong> {{ blog.updated_at }}</p>
    <p>{{ blog.content }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar Publicación</button>
        <a href="{% url 'post_detail' blog.pk %}">Cancelar</a>
    </form>
{% endblock content %}
